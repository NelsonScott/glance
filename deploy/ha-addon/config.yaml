name: Glance Feeds
version: "1.0.5"
slug: glance_feeds
description: Browserless Glance dashboard feed service (Flask, port 8090)
arch:
  - aarch64
init: false
host_network: false
homeassistant_api: true   # lets the feed service read HA's calendar.* (Next Up tile) via the supervisor proxy
ports:
  "8090/tcp": 8090
ports_description:
  "8090/tcp": Glance dashboard UI + /all JSON
options:
  google_maps_key: ""
  gmail_client_id: ""
  gmail_client_secret: ""
  gmail_refresh_token: ""
schema:
  google_maps_key: "str?"
  gmail_client_id: "str?"
  gmail_client_secret: "str?"
  gmail_refresh_token: "str?"
